# Test Configuration
spring:
  application:
    name: api-tests

# Service URLs
services:
  user-service:
    base-url: http://localhost:8081
    context-path: /api/v1
  permission-service:
    base-url: http://localhost:8082
    context-path: /api/v1
  document-service:
    base-url: http://localhost:8083
    context-path: /api/v1
  workflow-service:
    base-url: http://localhost:8084
    context-path: /api/v1
  notification-service:
    base-url: http://localhost:8085
    context-path: /api/v1
  collab-service:
    base-url: http://localhost:8086
    context-path: /api/v1
  search-service:
    base-url: http://localhost:8087
    context-path: /api/v1
  storage-service:
    base-url: http://localhost:8088
    context-path: /api/v1

# Test settings
test:
  timeout: 30000
  retry:
    max-attempts: 3
    delay: 1000
  reports:
    output-dir: target/surefire-reports
    format: detailed

# Database configuration for tests (H2 in-memory)
database:
  h2:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

# Logging
logging:
  level:
    root: INFO
    com.example.tests: DEBUG
    io.rest-assured: DEBUG