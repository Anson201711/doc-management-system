server:
  port: 8084

spring:
  application:
    name: search-service
  elasticsearch:
    uris: http://localhost:9200
  data:
    elasticsearch:
      cluster-name: elasticsearch
      cluster-nodes: localhost:9200

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info