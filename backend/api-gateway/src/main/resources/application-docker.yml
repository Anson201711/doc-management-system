server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users/**,/api/v1/auth/**
          filters:
            - StripPrefix=1
        - id: permission-service
          uri: http://permission-service:8082
          predicates:
            - Path=/api/v1/permissions/**
          filters:
            - StripPrefix=1
        - id: document-service
          uri: http://document-service:8083
          predicates:
            - Path=/api/v1/documents/**
          filters:
            - StripPrefix=1
        - id: workflow-service
          uri: http://workflow-service:8084
          predicates:
            - Path=/api/v1/workflows/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=1
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      enabled: true
    health:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO