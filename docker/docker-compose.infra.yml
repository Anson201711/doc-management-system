services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: docman-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: docman
      MYSQL_USER: docman
      MYSQL_PASSWORD: docman123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - docman-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: docman-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - docman-network
    command: redis-server --appendonly yes

  # Elasticsearch 搜索
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: docman-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - docman-network

  # Nacos 服务注册/配置中心
  nacos:
    image: nacos/nacos-server:v2.2.3
    # 如拉取失败，可使用国内镜像: dockerpull.com/nacos/nacos-server:v2.2.3
    container_name: docman-nacos
    restart: always
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=docman
      - MYSQL_SERVICE_PASSWORD=docman123
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - docman-network

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: docman-minio
    restart: always
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - docman-network
    command: server /data --console-address ":9001"

  # Nginx 网关/前端
  nginx:
    image: nginx:alpine
    container_name: docman-nginx
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    networks:
      - docman-network

volumes:
  mysql_data:
  redis_data:
  elasticsearch_data:
  minio_data:

networks:
  docman-network:
    driver: bridge
