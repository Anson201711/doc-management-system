version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: docman-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: docman
      MYSQL_USER: docman
      MYSQL_PASSWORD: docman123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - docman-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: docman-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - docman-network

  # 用户服务
  user-service:
    build:
      context: ../backend/user-service
      dockerfile: Dockerfile
    container_name: docman-user-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/docman?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - docman-network

  # 权限服务
  permission-service:
    build:
      context: ../backend/permission-service
      dockerfile: Dockerfile
    container_name: docman-permission-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/docman?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - docman-network

  # 文档服务
  document-service:
    build:
      context: ../backend/document-service
      dockerfile: Dockerfile
    container_name: docman-document-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/docman?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_REDIS_HOST: redis
    volumes:
      - document_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - docman-network

  # 工作流服务
  workflow-service:
    build:
      context: ../backend/workflow-service
      dockerfile: Dockerfile
    container_name: docman-workflow-service
    restart: always
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://3306/docman?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - docman-network

  # 通知服务
  notification-service:
    build:
      context: ../backend/notification-service
      dockerfile: Dockerfile
    container_name: docman-notification-service
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - docman-network

  # Nginx 网关/前端
  nginx:
    image: nginx:alpine
    container_name: docman-nginx
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - user-service
      - permission-service
      - document-service
      - workflow-service
      - notification-service
    networks:
      - docman-network

volumes:
  mysql_data:
  redis_data:
  document_storage:

networks:
  docman-network:
    driver: bridge