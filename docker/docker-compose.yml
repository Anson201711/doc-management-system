version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: docman-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: docman
      MYSQL_USER: docman
      MYSQL_PASSWORD: docman123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - docman-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: docman-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - docman-network

  # Elasticsearch 搜索引擎
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: docman-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - docman-network

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: docman-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - docman-network

  # API Gateway
  api-gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docman-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - docman-network

  # 用户服务
  user-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docman-user-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - docman-network

  # 权限服务
  permission-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docman-permission-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - docman-network

  # 文档服务
  document-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docman-document-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - document_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - docman-network

  # 工作流服务
  workflow-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docman-workflow-service
    restart: always
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - docman-network

  # 通知服务
  notification-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docman-notification-service
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      redis:
        condition: service_started
    networks:
      - docman-network

  # 协作服务 (评论/批注/WebSocket)
  collab-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docman-collab-service
    restart: always
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - docman-network

  # 搜索服务 (Elasticsearch)
  search-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docman-search-service
    restart: always
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      elasticsearch:
        condition: service_started
    networks:
      - docman-network

  # 存储服务 (MinIO)
  storage-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docman-storage-service
    restart: always
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      minio:
        condition: service_started
    networks:
      - docman-network

  # Nginx 网关/前端
  nginx:
    image: nginx:alpine
    container_name: docman-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api-gateway
      - user-service
      - permission-service
      - document-service
      - workflow-service
      - notification-service
      - collab-service
      - search-service
      - storage-service
    networks:
      - docman-network

  # Jenkins CI/CD
  jenkins:
    image: jenkins/jenkins:jdk17
    container_name: docman-jenkins
    restart: always
    ports:
      - "8089:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - docman-network

volumes:
  mysql_data:
  redis_data:
  es_data:
  minio_data:
  document_storage:
  jenkins_home:

networks:
  docman-network:
    driver: bridge